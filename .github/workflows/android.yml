name: Build Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Scramble the app code (protects the linking engine)
        working-directory: build
        run: npm install --no-audit --no-fund && node protect.mjs
      - name: Bundle the scrambled page into the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp dist/index.html android/app/src/main/assets/index.html
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Publish the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk field-vault.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest field-vault.apk --title "Field Vault (latest)" --notes "Install field-vault.apk on your Android phone."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
